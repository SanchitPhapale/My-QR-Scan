<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#logoGrad)"/>
  <!-- Top-left finder pattern -->
  <rect x="7" y="7" width="18" height="18" rx="3" fill="white" opacity="0.95"/>
  <rect x="10" y="10" width="12" height="12" rx="2" fill="url(#logoGrad)"/>
  <rect x="13" y="13" width="6" height="6" rx="1" fill="white"/>
  <!-- Top-right finder pattern -->
  <rect x="39" y="7" width="18" height="18" rx="3" fill="white" opacity="0.95"/>
  <rect x="42" y="10" width="12" height="12" rx="2" fill="url(#logoGrad)"/>
  <rect x="45" y="13" width="6" height="6" rx="1" fill="white"/>
  <!-- Bottom-left finder pattern -->
  <rect x="7" y="39" width="18" height="18" rx="3" fill="white" opacity="0.95"/>
  <rect x="10" y="42" width="12" height="12" rx="2" fill="url(#logoGrad)"/>
  <rect x="13" y="45" width="6" height="6" rx="1" fill="white"/>
  <!-- Center $ symbol -->
  <text x="32" y="38" font-family="Georgia,serif" font-weight="700" font-size="16" fill="white" text-anchor="middle">$</text>
</svg>
